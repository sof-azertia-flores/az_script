plugins { id 'java-library' }
group = 'azertia'
version = '2.0.0'
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}
// The host bridge has no runtime dependency on Gson, a remote Maven repository,
// or a particular compiler artifact. It accepts compiled ABD bytecode files.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
